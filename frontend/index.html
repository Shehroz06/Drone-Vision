<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Drone Vision — Path Monitor</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

  <style>
    /* ── Reset & palette ─────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      /* Google-Maps-style light palette */
      --bg:        #f5f3ef;   /* off-white page bg, like Maps' base land color */
      --surface:   #ffffff;
      --border:    #e3e1dc;
      --border-strong: #c9c7c1;
      --text:      #202124;   /* GMaps near-black text */
      --muted:     #5f6368;   /* GMaps secondary grey */
      --accent:    #1a73e8;   /* GMaps blue */
      --accent-dark: #0b57b8;
      --green:     #188038;
      --yellow:    #e37400;
      --red:       #ea4335;   /* GMaps pin red */
      --road:      #ffffff;   /* "street" lines on the grid */
      --road-shadow: rgba(60, 64, 67, 0.10);
      --water:     #aadaff;
      --path:      #1a73e8;
      --shadow-1:  0 1px 2px rgba(60,64,67,.30), 0 1px 3px 1px rgba(60,64,67,.15);
      --shadow-2:  0 1px 3px rgba(60,64,67,.30), 0 4px 8px 3px rgba(60,64,67,.15);
    }

    html, body {
      height: 100%;
      font-family: 'Google Sans', Roboto, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    body { display: flex; flex-direction: column; }

    /* ── Header ──────────────────────────────────────────────────── */
    header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 16px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      box-shadow: var(--shadow-1);
      flex-shrink: 0;
      z-index: 20;
      position: relative;
    }

    .title {
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.01em;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .title .icon {
      color: var(--accent);
      font-size: 16px;
    }

    .badge {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.08em;
      padding: 3px 8px;
      border-radius: 10px;
      background: #e6f0fe;
      border: 1px solid #c2dbfc;
      color: var(--accent-dark);
    }

    /* ── Status ──────────────────────────────────────────────────── */
    .status {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-left: auto;
      font-size: 12px;
      font-weight: 500;
      color: var(--muted);
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--muted);
      flex-shrink: 0;
    }

    @keyframes live {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.35; }
    }

    .dot.green  {
      background: var(--green);
      box-shadow: 0 0 5px var(--green);
      animation: live 2s ease-in-out infinite;
    }
    .dot.yellow { background: var(--yellow); box-shadow: 0 0 5px var(--yellow); }
    .dot.red    { background: var(--red);    box-shadow: 0 0 5px var(--red); }

    /* ── Map wrapper ─────────────────────────────────────────────── */
    #map-wrap {
      position: relative;
      flex: 1;
      min-height: 0;
      isolation: isolate;   /* explicit stacking context — all z-index comparisons
                               happen here; nothing leaks to body or root */
    }

    #map {
      position: absolute;
      inset: 0;
      background: var(--bg);
      /* no z-index — Leaflet's internal panes (200–800) participate directly
         in #map-wrap's stacking context so they still layer correctly among
         themselves, while staying below our 1000-level overlays */
    }

    .leaflet-container { background: var(--bg); }

    /* Google-Maps-style zoom control: rounded pill, white, shadow */
    .leaflet-control-zoom {
      border: none !important;
      border-radius: 8px !important;
      box-shadow: var(--shadow-2) !important;
      overflow: hidden;
    }
    .leaflet-control-zoom a {
      background: var(--surface) !important;
      border-color: var(--border) !important;
      color: var(--text)    !important;
      width: 38px !important;
      height: 38px !important;
      line-height: 38px !important;
      font-size: 19px !important;
      font-weight: 400 !important;
    }
    .leaflet-control-zoom a:first-child {
      border-bottom: 1px solid var(--border) !important;
    }
    .leaflet-control-zoom a:hover { background: #f1f3f4 !important; }

    /* Smooth marker movement */
    .leaflet-marker-icon { transition: transform 0.25s ease-out; }

    /* ── Current-position marker (Google-Maps pin style) ─────────── */
    .pos-dot {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--accent);
      border: 3px solid #fff;
      box-shadow: var(--shadow-1);
      animation: pos-pulse 1.8s ease-out infinite;
    }

    @keyframes pos-pulse {
      0%   { box-shadow: var(--shadow-1), 0 0 0 0   rgba(26, 115, 232, 0.55); }
      70%  { box-shadow: var(--shadow-1), 0 0 0 12px rgba(26, 115, 232, 0);   }
      100% { box-shadow: var(--shadow-1), 0 0 0 0   rgba(26, 115, 232, 0);    }
    }

    /* ── Axis coordinate labels (overlaid on map, GMaps-esque chips) ── */
    .axis-label {
      position: absolute;
      font-size: 11px;
      font-weight: 500;
      color: var(--muted);
      background: rgba(255,255,255,0.85);
      padding: 1px 5px;
      border-radius: 4px;
      pointer-events: none;
      z-index: 1000;
      font-family: Roboto, sans-serif;
    }

    /* ── Compass (top-right, GMaps style) ──────────────────────── */
    #compass {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 1000;  /* above Leaflet's max (control pane = 800) */
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: var(--surface);
      box-shadow: var(--shadow-2);
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }
    #compass span {
      font-size: 11px;
      font-weight: 700;
      color: var(--red);
      transform: translateY(-9px);
    }
    #compass::after {
      content: '';
      position: absolute;
      width: 1px;
      height: 26px;
      background: linear-gradient(to bottom, var(--red) 50%, var(--border-strong) 50%);
    }
#telemetry {
  position: fixed;
  z-index: 9999;
}
    /* ── Telemetry panel (top-right, below compass) ─────────────── */
    #telemetry {
      position: absolute;
      top: 62px;
      right: 12px;
      z-index: 1000;  /* above Leaflet's max (control pane = 800) */
      background: rgba(255, 255, 255, 0.93);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 14px;
      min-width: 158px;
      box-shadow: var(--shadow-2);
      pointer-events: none;
    }

    .tele-title {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .tele-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 10px;
      padding: 2px 0;
    }

    .tele-label {
      font-size: 11px;
      color: var(--muted);
    }

    .tele-value {
      font-size: 12px;
      font-weight: 600;
      color: var(--text);
      font-variant-numeric: tabular-nums;
    }

    /* ── Footer ──────────────────────────────────────────────────── */
    footer {
      display: flex;
      align-items: center;
      gap: 24px;
      padding: 8px 16px;
      background: var(--surface);
      border-top: 1px solid var(--border);
      font-size: 12px;
      color: var(--muted);
      flex-shrink: 0;
      z-index: 20;
    }

    footer .stat  { display: flex; align-items: center; gap: 6px; }
    footer .label { color: var(--muted); }
    footer .value { color: var(--text); font-weight: 500; }
  </style>
</head>
<body>

  <header>
    <span class="title"><span class="icon">◈</span> Drone Vision - Path Monitor</span>
    <span class="badge">LIVE</span>
    <div class="status">
      <div id="dot" class="dot yellow"></div>
      <span id="status-text">Connecting…</span>
    </div>
  </header>

  <div id="map-wrap">
    <div id="map"></div>
    <div id="compass"><span>N</span></div>

    <div id="telemetry">
      <div class="tele-title">Position</div>
      <div class="tele-row">
        <span class="tele-label">Lat</span>
        <span class="tele-value" id="tele-lat">—</span>
      </div>
      <div class="tele-row">
        <span class="tele-label">Lon</span>
        <span class="tele-value" id="tele-lon">—</span>
      </div>
    </div>
  </div>

  <footer>
    <div class="stat">
      <span class="label">Waypoints</span>
      <span class="value" id="foot-points">—</span>
    </div>
    <div class="stat">
      <span class="label">Updated</span>
      <span class="value" id="foot-time">—</span>
    </div>
    <div class="stat">
      <span class="label">Updates received</span>
      <span class="value" id="foot-count">0</span>
    </div>
  </footer>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="script.js"></script>

</body>
</html>
